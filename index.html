<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通俗解释 · 官方主页</title>
  <meta name="description" content="把复杂的事情，解释得简单些。通俗的解释，是勾勒出事情的本质；真正的理解，是用「已知」连接「未知」。">
  <style>
    :root {
      --bg: #F2F0E9;
      --card-bg: #FAF9F5;
      --card-inner: #FFFFFF;
      --ink: #1A1C18;
      --ink-muted: #55594F;
      --ink-light: #7E8277;
      --line: rgba(26, 28, 24, 0.15);
      --marker: rgba(230, 138, 0, 0.22);
      --max-w: 740px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.8;
      padding: 48px 24px 120px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* Hand-drawn SVG Divider */
    .sketch-divider {
      width: 100%;
      height: 12px;
      margin: 48px 0;
      display: block;
      overflow: visible;
    }

    /* Sketch Card Base (Strictly level, SVG handles both fill and stroke) */
    .sketch-card {
      position: relative;
      background: transparent;
      box-shadow: none;
      border: none;
      transition: transform 0.2s ease;
    }

    .sketch-card > * {
      position: relative;
      z-index: 1;
    }

    .sketch-card:hover {
      transform: translateY(-2px);
    }

    .sketch-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    /* Marker Pen Highlight */
    .marker {
      background: linear-gradient(104deg, rgba(230, 138, 0, 0) 0.5%, var(--marker) 2%, var(--marker) 95%, rgba(230, 138, 0, 0) 98%);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
    }

    /* Header */
    header.site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border: 1.8px solid var(--ink);
      border-radius: 48% 52% 46% 54% / 53% 47% 55% 45%;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #F2F0E9;
      font-size: 1.1rem;
      font-weight: 700;
    }

    nav.site-nav {
      display: flex;
      gap: 22px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    nav.site-nav a {
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    nav.site-nav a:hover {
      color: var(--ink);
    }

    nav.site-nav a.highlight-nav {
      color: var(--ink);
      font-weight: 700;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 2px;
    }

    /* Hero */
    .hero {
      padding: 16px 0 8px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5.5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.025em;
      margin-bottom: 20px;
    }

    /* Whiteboard Stage */
    .whiteboard-stage {
      padding: 32px 36px;
      margin: 28px 0;
    }

    .whiteboard-statement {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.9;
      color: var(--ink);
      margin-bottom: 0;
    }

    .whiteboard-statement p {
      margin-bottom: 8px;
    }

    .whiteboard-statement p:last-child {
      margin-bottom: 0;
    }

    /* Sections */
    section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }

    /* Stance Section */
    .stance-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (max-width: 620px) {
      .stance-grid { grid-template-columns: 1fr; }
    }

    .stance-card {
      padding: 24px 26px;
    }

    .stance-label {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 2px;
    }

    .stance-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .stance-card p {
      font-size: 0.92rem;
      color: var(--ink-muted);
      line-height: 1.7;
      margin: 0;
    }

    /* Focus Areas */
    .areas-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .area-card {
      padding: 22px 26px;
    }

    .area-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }

    .area-num {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ink-light);
    }

    .area-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
    }

    .area-card p {
      font-size: 0.93rem;
      color: var(--ink-muted);
      line-height: 1.7;
      margin: 0;
    }

    /* Platforms Grid */
    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 640px) {
      .platforms-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .platform-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 14px;
      text-decoration: none;
      color: var(--ink);
      gap: 10px;
    }

    .platform-card .hand-icon {
      width: 42px;
      height: 42px;
      display: block;
    }

    .platform-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
    }

    .platform-sub {
      font-size: 0.78rem;
      color: var(--ink-light);
      margin-top: -4px;
    }

    /* Commercial Bridge */
    .cooperate-strip {
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .cooperate-strip p {
      font-size: 0.95rem;
      color: var(--ink-muted);
      margin: 0;
    }

    .cooperate-strip a.cooperate-btn {
      color: var(--ink);
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 2px;
      white-space: nowrap;
    }

    .cooperate-strip a.cooperate-btn:hover {
      opacity: 0.75;
    }

    /* Footer */
    footer.site-footer {
      margin-top: 80px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--ink-light);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
  </style>
</head>
